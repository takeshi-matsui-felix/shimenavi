<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>締めナビ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g5%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238B6CFF%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232B1B8F%22/%3E%3C/linearGradient%3E%3C/defs%3E%0A%3Cpolygon%20points%3D%2260%2C6%20108%2C33%20108%2C87%2060%2C114%2012%2C87%2012%2C33%22%20fill%3D%22url%28%23g5%29%22%20stroke%3D%22url%28%23g5%29%22%20stroke-width%3D%228%22%20stroke-linejoin%3D%22round%22/%3E%0A%3Cpath%20d%3D%22M26%2042%20L48%2060%20L26%2078%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%0A%3Cpath%20d%3D%22M94%2042%20L72%2060%20L94%2078%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%0A%3Cline%20x1%3D%2260%22%20y1%3D%2234%22%20x2%3D%2260%22%20y2%3D%2286%22%20stroke%3D%22%23FFD166%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#6b7384;--line:#e1e4ea;--accent:#1f5eff;--red:#c0392b;--green:#1e8449;--hbg:#fff;--hink:#1d2330;--thbg:#fff;--thc:#6b7384}
:root[data-theme=B]{--bg:#e9edf5;--line:#c9d2e3;--hbg:#1f3864;--hink:#fff;--thbg:#1f3864;--thc:#fff}
:root[data-theme=C]{--bg:#ece9f7;--line:#d3cdee;--accent:#6a4cff;--hbg:#2b1b8f;--hink:#fff;--thbg:#2b1b8f;--thc:#fff}
:root[data-theme=D]{--bg:#14171d;--card:#1d2129;--ink:#e8eaf0;--mute:#9aa3b5;--line:#2c323d;--accent:#6f9bff;--red:#ff7b6b;--green:#5fd18a;--hbg:#1d2129;--hink:#e8eaf0;--thbg:#1d2129;--thc:#9aa3b5}
:root[data-theme=E]{--bg:#e8f1ec;--line:#c5d9cd;--accent:#1e8449;--green:#16703d;--hbg:#1b5e3b;--hink:#fff;--thbg:#1b5e3b;--thc:#fff}
.themes{margin-left:auto;display:flex;gap:6px;align-items:center}.themes b{font-size:11px;font-weight:400;margin-right:2px}
.themes button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;outline:1px solid rgba(128,128,128,.5)}
.themes button.on{border-color:var(--hink);outline-color:var(--accent)}
*{box-sizing:border-box}
a{color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--hbg);color:var(--hink);display:flex;align-items:center;gap:12px}
header h1{font-size:17px;margin:0}header>span{opacity:.75;font-size:12px}
main{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:600}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;white-space:nowrap;padding:7px 0;border:0;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button:disabled{opacity:.4;cursor:default}
.seg button.on{background:var(--accent);color:#fff}
.drop{margin-top:6px;border:2px dashed var(--line);border-radius:8px;padding:18px 8px;text-align:center;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;color:var(--mute)}.kpi .d{font-size:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--thc);font-weight:600;position:sticky;top:0;background:var(--thbg)}
td.t,th.t{text-align:left;white-space:normal}
tr.sub td{font-weight:700;background:var(--bg)}
.pos{color:var(--red);font-weight:600}.neg{color:var(--green);font-weight:600}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.tag.out{border-color:#e6a23c;color:#b9770e}
.scroll{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.warn{background:#fff4e5;color:#8a5a00;border:1px solid #f0c987;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
details summary{cursor:pointer;font-weight:600}
td input.cm{width:100%;padding:3px 6px;font-size:12px}
td select{padding:3px 4px;font-size:12px;max-width:260px}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}
.lock .card{width:340px;text-align:center}.lock h1{font-size:20px;margin:0 0 4px}.lock p{color:var(--mute);margin:0 0 14px;font-size:12px}
.lock .err{color:var(--red);min-height:20px;font-size:12px;margin-top:8px}.lock .btn{width:100%;margin-top:10px;background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header><h1><svg viewBox="0 0 120 120" width="30" height="30" style="vertical-align:middle"><defs><linearGradient id="g5h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#2B1B8F"/></linearGradient></defs>
<polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="url(#g5h)" stroke="url(#g5h)" stroke-width="8" stroke-linejoin="round"/>
<path d="M26 42 L48 60 L26 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M94 42 L72 60 L94 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="60" y1="34" x2="60" y2="86" stroke="#FFD166" stroke-width="9" stroke-linecap="round"/></svg> 締めナビ</h1><span>想定原価（一覧タブ）・仮実行予算・結果（建物原価PDF）を項目ごとに比較</span><div class="themes" id="themes"><b>画面の色</b></div></header>
<div class="lock" id="lock"><div class="card"><h1><svg viewBox="0 0 120 120" width="56" height="56" style="vertical-align:middle"><defs><linearGradient id="g5l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#2B1B8F"/></linearGradient></defs>
<polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="url(#g5l)" stroke="url(#g5l)" stroke-width="8" stroke-linejoin="round"/>
<path d="M26 42 L48 60 L26 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M94 42 L72 60 L94 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="60" y1="34" x2="60" y2="86" stroke="#FFD166" stroke-width="9" stroke-linecap="round"/></svg><br>締めナビ</h1><p>物件の原価締めを、想定とPDFの結果で比較します。<br>パスワードを入力してください。</p>
<input type="password" id="pw" placeholder="パスワード" autocomplete="current-password"><div class="err" id="lockErr"></div><button class="btn" id="unlock">開く</button></div></div>
<main>
 <aside class="card">
  <h2>① 実行予算（結果）PDF</h2>
  <div class="drop" id="drop">ここにPDFをドロップ<br>またはクリックして選択</div>
  <input type="file" id="file" accept="application/pdf" hidden>
  <div class="hint" id="pdfinfo"></div>
  <h2 style="margin-top:16px">② 仮実行予算PDF（任意）</h2>
  <div class="drop" id="dropB">ここにPDFをドロップ<br>またはクリックして選択</div>
  <input type="file" id="fileB" accept="application/pdf" hidden>
  <div class="hint" id="pdfinfoB"></div>
  <div class="hint" id="linkinfo" style="color:var(--ink)"></div>
  <h2 style="margin-top:18px">③ 物件条件（PDF取込で自動判定）</h2>
  <label>エリア</label><div class="seg" id="sArea"></div>
  <label>プラン</label><div class="seg" id="sPlan"></div>
  <label>戸数</label><div class="seg" id="sUnits"></div>
  <label>住戸㎡帯（1LDKのみ）</label><div class="seg" id="sBand"></div>
  <div class="hint" id="basis"></div>
  <div class="hint" id="autoinfo" style="color:var(--ink)"></div>
 </aside>
 <section id="out"><div class="card empty">PDFを取り込んでください。</div></section>
</main>

let MK=null;
function buildMK(){if(MK)return MK;MK={};for(const it of MASTER.items){const k=norm(it.name),o=MK[k]=MK[k]||{};for(const c in it.values)o[c]=(o[c]||0)+it.values[c];}return MK;}
function detect(P){
  const mk=buildMK(),keys=Object.keys(mk),res={},cols=Object.keys(MASTER.items[0].values);
  for(const it of P.items){if(!it.amount)continue;let k=norm(it.name);if(ALIAS[k])k=ALIAS[k];
    const h=mk[k]?k:(k.length>=4?keys.find(x=>x.length>=4&&(x.startsWith(k)||k.startsWith(x))):null);if(h)res[h]=(res[h]||0)+it.amount;}
  const n=Object.keys(res).length;
  const score=c=>{let s=0;for(const k in res){const m=mk[k][c],v=res[k];s-=Math.min(1,Math.abs(v-m)/Math.max(v,m,1));}return s;};
  const best=cs=>cs.reduce((a,c)=>score(c)>score(a)?c:a,cs[0]);
  const cityA=cityArea(P.meta.place);
  const amtA=n>=15?best(cols).split("|")[0]:null;
  const area=cityA||amtA, src=cityA?"地名":"金額";
  if(!area)return {ok:false,n};
  if(n<15)return {ok:true,area,src,partial:true,n};
  const [,plan,units,bd]=best(cols.filter(c=>c.startsWith(area+"|"))).split("|");
  return {ok:true,area,src,plan,units:+units,band:bd==="25"?state.band:bd,n,
    warn:(cityA&&amtA&&cityA!==amtA)?`地名は${cityA}ですが、金額は${amtA}の単価に近いです。`:""};
}

function masterRows(){
  const mk=`${state.area}|${state.plan}|${state.units}|${band()}`, rows=new Map();
  for(const it of MASTER.items){
    const k=norm(it.name), v=it.values[mk]||0;
    if(!rows.has(k))rows.set(k,{key:k,name:it.name,base:it.name.replace(/\s*[（(].*/,"").trim(),n:1,exp:v});
    else{const r=rows.get(k);r.n++;r.exp+=v;}
  }
  const out=[...rows.values()];out.forEach(r=>{if(r.n>1)r.name=`${r.base}（${r.n}項目合算）`});return out;
}

        e[col]+=it.amount;e[scol]+=(e[scol]?" ":"")+`#${it.no}${it.vendor?" "+it.vendor:""}`;}}};
  feed(R,state.map,"res","src");feed(B,state.mapB,"bud","bsrc");
  for(const r of rows){r.val=R?r.res:r.bud;r.d2=r.val-r.exp;r.d1=(R&&B)?r.res-r.bud:r.d2;r.diff=r.d1;
    r.srcAll=(R&&B)?[r.src&&"結果:"+r.src,r.bsrc&&"仮:"+r.bsrc].filter(Boolean).join(" ／ "):(R?r.src:r.bsrc);}

}
function summ(P,rows,col){
  const f=ks=>rows.filter(r=>ks.includes(r.cls)).reduce((a,r)=>a+r[col],0);
  const B=f(["建物","マスタ外(建物)"]),M=f(["土地へ振替"]),X=f(["マスタ外(土地)"]);

// 土地原価の明細（PDFの土地原価欄 − 建物へ引っ越した項目 ＋ 土地へ回した項目）
function landRows(){
  const m=new Map();
  const add=(P,map,col)=>{if(!P)return;
    const list=[...P.landKeep,...P.items.filter(it=>{const t=map[it.no];return t==="__L"||LAND_KEYS.has(t);})];
    for(const it of list){let k=norm(it.name);if(ALIAS[k])k=ALIAS[k];
      let e=m.get(k);if(!e){e={name:it.name,res:0,bud:0};m.set(k,e);}
      e[col]+=it.amount;}};
  add(state.pdf,state.map,"res");add(state.bud,state.mapB,"bud");
  return [...m.values()].filter(e=>e.res||e.bud).map(e=>({...e,val:state.pdf?e.res:e.bud,d:state.pdf&&state.bud?e.res-e.bud:0}));
}

    return {hr:r,fix:h.indexOf("fixno"),area:f("エリア"),tan:f("現場担当"),name:f("物件名"),units:f("戸数"),plan:f("間取"),sqm:f("居室"),cost:f("建物原価"),note:f("備考"),date:f("引渡日"),rep:f("報告")};}}
  return null;
}
const GREEN={red:.714,green:.843,blue:.659};
// 一覧タブが空のとき、スクショと同じ見出しを作る
function listLayoutRequests(sid){
  const H=["報告","FiX\nNO","エリア","現場担当","物件名（仮称）","戸数","間取","居室\n㎡数","②引渡時\n実行予算\n建物原価","備考","引渡日"],W=[60,70,70,90,330,50,60,60,120,200,100];
  const rq=[{updateCells:{range:{sheetId:sid,startRowIndex:0,endRowIndex:2,startColumnIndex:0,endColumnIndex:11},fields:"userEnteredValue,userEnteredFormat",
    rows:[{values:[{userEnteredValue:{stringValue:"建設部原価管理一覧（2026/10～2027/09）"},userEnteredFormat:{textFormat:{bold:true,fontSize:16}}}]},
      {values:H.map(t=>({userEnteredValue:{stringValue:t},userEnteredFormat:{backgroundColor:GREEN,textFormat:{bold:true},horizontalAlignment:"CENTER",verticalAlignment:"MIDDLE",wrapStrategy:"WRAP"}}))}]}},
   {updateDimensionProperties:{range:{sheetId:sid,dimension:"ROWS",startIndex:1,endIndex:2},properties:{pixelSize:70},fields:"pixelSize"}},
   {updateSheetProperties:{properties:{sheetId:sid,gridProperties:{frozenRowCount:2}},fields:"gridProperties.frozenRowCount"}},
   {setBasicFilter:{filter:{range:{sheetId:sid,startRowIndex:1,endRowIndex:1000,startColumnIndex:0,endColumnIndex:11}}}}];
  W.forEach((w,i)=>rq.push({updateDimensionProperties:{range:{sheetId:sid,dimension:"COLUMNS",startIndex:i,endIndex:i+1},properties:{pixelSize:w},fields:"pixelSize"}}));
  return rq;
}
// FiX NO で行を探し、あれば更新・なければ末尾に追加する
async function listUpsert(tok,cfg,meta,newSid,tabName){
  const R=state.pdf,L=state.last,m=R.meta,fix=+m.no;if(!fix)return {skipped:"FiX NOが読み取れないため一覧には登録しませんでした"};
  const lname=cfg.listName||LIST_TITLE;let tab=meta.sheets.map(s=>s.properties).find(p=>p.title===lname);
  let reqs=[],created=false,rows=[];
  if(!tab){const sid=Math.floor(Math.random()*2e9)+1;tab={sheetId:sid,title:lname,gridProperties:{rowCount:1000}};created=true;
    reqs.push({addSheet:{properties:{sheetId:sid,title:lname,gridProperties:{rowCount:1000,columnCount:12}}}});}
  else{const j=await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}/values/${encodeURIComponent(qs(tab.title)+"!A1:Z1500")}`,tok);rows=j.values||[];}
  let C=listCols(rows);
  if(!C){
    if(rows.some(r=>(r||[]).some(x=>String(x||"").trim()!="")))return {skipped:`一覧タブ「${lname}」に見出し（FiX NO・エリア・物件名）が見つからないため、登録しませんでした`};
    reqs.push(...listLayoutRequests(tab.sheetId));C={hr:1,fix:1,area:2,tan:3,name:4,units:5,plan:6,sqm:7,cost:8,note:9,date:10,rep:0};rows=[[],[]];}
  let idx=-1,last=C.hr;
  for(let r=C.hr+1;r<rows.length;r++){const row=rows[r]||[];if(row.some(x=>String(x||"").trim()!==""))last=r;if(Number(String(row[C.fix]||"").replace(/[^\d]/g,""))===fix)idx=r;}
  const isNew=idx<0;if(isNew)idx=last+1;
  const rc=(tab.gridProperties&&tab.gridProperties.rowCount)||1000;
  if(isNew&&idx+2>rc)reqs.push({appendDimension:{sheetId:tab.sheetId,dimension:"ROWS",length:Math.max(50,idx+2-rc)}});
  const rg=c=>({sheetId:tab.sheetId,startRowIndex:idx,endRowIndex:idx+1,startColumnIndex:c,endColumnIndex:c+1});
  if(isNew&&idx>C.hr+1){const src={sheetId:tab.sheetId,startRowIndex:idx-1,endRowIndex:idx,startColumnIndex:0,endColumnIndex:12},dst={sheetId:tab.sheetId,startRowIndex:idx,endRowIndex:idx+1,startColumnIndex:0,endColumnIndex:12};
    reqs.push({copyPaste:{source:src,destination:dst,pasteType:"PASTE_FORMAT"}},{copyPaste:{source:src,destination:dst,pasteType:"PASTE_DATA_VALIDATION"}});}
  const put=(c,val,nf)=>{if(c<0||val===""||val===undefined||val===null)return;
    const v=typeof val==="number"?{numberValue:val}:(val&&val.f?{formulaValue:val.f}:{stringValue:String(val)});
    reqs.push({updateCells:{range:rg(c),rows:[{values:[{userEnteredValue:v,...(nf?{userEnteredFormat:{numberFormat:{type:"NUMBER",pattern:nf}}}:{})}]}],fields:"userEnteredValue"+(nf?",userEnteredFormat.numberFormat":"")}});};
  const rv=regVals(), nm="Jack"+m.place.replace(/\s/g,"");
  put(C.fix,fix);put(C.area,prefOf(m.place));
  put(C.name,{f:`=HYPERLINK("#gid=${newSid}","${nm.replace(/"/g,'""')}")`});
  put(C.units,+rv.units||"");put(C.plan,rv.plan);put(C.sqm,+rv.sqm||"");put(C.cost,L.sums.res.B,"#,##0");
  put(C.tan,rv.tan);put(C.date,rv.date);put(C.note,rv.note);   // 人が入れる列: 入力があるときだけ書く
  if(isNew&&C.rep>=0)reqs.push({updateCells:{range:rg(C.rep),rows:[{values:[{userEnteredValue:{boolValue:false},dataValidation:{condition:{type:"BOOLEAN"}}}]}],fields:"userEnteredValue,dataValidation"}});
  await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}:batchUpdate`,tok,{requests:reqs});
  return {created,isNew,row:idx+1,gid:tab.sheetId};
}

async function pushToSheet(){
  const L=state.last;if(!L)return;const st=$("gstat"),cfg=gsCfg();
  if(!cfg.clientId){openSetup();return;}
  st.textContent="Googleにログインして追加中…";
  try{
    const wb=new ExcelJS.Workbook(),ws=newSheet(wb),{cf}=buildSheet(ws),model=wsToModel(ws,cf);
    const tok=await gToken(cfg.clientId), base=`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}`;
    const meta=await gApi(`${base}?fields=sheets.properties(sheetId,title,index,gridProperties.rowCount)`,tok);
    const props=meta.sheets.map(s=>s.properties), lname=cfg.listName||LIST_TITLE;
    let name=((state.tabName||autoTabName()).trim()||"新規").replace(/[\[\]*?:\/\\]/g,"").slice(0,90);
    if(name===lname||name===LIST_TITLE)name+="_報告";
    const old=props.find(p=>p.title===name), ids=new Set(props.map(p=>p.sheetId));
    let sid;do{sid=Math.floor(Math.random()*2e9)+1;}while(ids.has(sid));
    const reqs=[];if(old)reqs.push({deleteSheet:{sheetId:old.sheetId}});
    reqs.push(...modelToRequests(model,sid,name,old?old.index:undefined));
    await gApi(`${base}:batchUpdate`,tok,{requests:reqs});
    let msg=`追加しました（タブ名: ${esc(name)}${old?"・同名のタブを上書き":""}）　<a href="https://docs.google.com/spreadsheets/d/${cfg.sheetId}/edit#gid=${sid}" target="_blank" rel="noopener">開く</a>`;
    if(state.pdf){
      try{const r=await listUpsert(tok,cfg,{sheets:props.map(p=>({properties:p}))},sid,name);
        msg+=r.skipped?`<br>${esc(r.skipped)}`:`<br>一覧に${r.isNew?"追加":"更新"}しました（${r.row}行目${r.created?"・一覧タブを新規作成":""}）　<a href="https://docs.google.com/spreadsheets/d/${cfg.sheetId}/edit#gid=${r.gid}" target="_blank" rel="noopener">一覧を開く</a>`;}
      catch(e){msg+=`<br>一覧への登録に失敗しました: ${esc(e.message)}`;}
    }else msg+="<br>一覧への登録は、実行予算（結果）PDFがあるときに行います。";
    st.innerHTML=msg;
  }catch(e){st.textContent="追加できませんでした: "+e.message;}
}

/* ---------- 書類回覧書（Excel） ---------- */
async function exportKairan(){
  const P=state.pdf;if(!P)return;const m=P.meta;
  const wb=new ExcelJS.Workbook();
  await wb.xlsx.load(Uint8Array.from(atob(MASTER.kairan),c=>c.charCodeAt(0)).buffer);
  const ws=wb.worksheets[0], serial=Math.floor((Date.now()+9*3600e3)/86400e3)+25569;
  ws.getCell("AF2").value={formula:"TODAY()",result:serial};          // 日付 = TODAY
  ws.getCell("F7").value="実行予算回覧の件";                           // 詳細
  ws.getCell("F9").value=m.no===""?null:+m.no;                          // 概要: FIX NO・ブランド・物件名（入力元）
  ws.getCell("H9").value=m.brand;ws.getCell("J9").value=m.place;
  ws.getCell("N7").value={formula:"F9",result:m.no===""?0:+m.no};      // 詳細欄は概要欄を参照
  ws.getCell("P7").value={formula:"H9",result:m.brand};
  ws.getCell("R7").value={formula:"J9",result:m.place};
  wb.creator="";wb.lastModifiedBy="";
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=`${m.disp||"物件"}_書類回覧書.xlsx`;a.click();
}

/* ---------- 入力 ---------- */
function seg(id,vals,key){
  const el=$(id);el.innerHTML=vals.map(v=>`<button data-v="${v}" class="${state[key]==v?"on":""}">${v}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state[key]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;seg(id,vals,key);rematch();});
}
function rematch(){
  document.querySelectorAll("#sBand button").forEach(b=>b.disabled=state.plan==="1K");
  $("basis").textContent=`想定の基準: ${state.area} / ${state.plan} / ${state.units}戸 / ${bandLabel()}`;
  const mr=masterRows();if(state.pdf)state.map=autoMatch(state.pdf.items,mr);if(state.bud)state.mapB=autoMatch(state.bud.items,mr);
  render();
}
seg("sArea",["関東","東海"],"area");seg("sPlan",["1LDK","1K"],"plan");seg("sUnits",[6,9,12],"units");
seg("sBand",BANDS,"band");
function updateLink(){
  const el=$("linkinfo");state.link=null;
  if(!(state.pdf&&state.bud)){el.innerHTML="";return;}
  const lk=state.link=linkCheck(state.pdf,state.bud);
  const col=lk.level==="ok"?"var(--green)":lk.level==="warn"?"#b9770e":"var(--red)";
  el.innerHTML=`<b style="color:${col}">${lk.level==="ok"?"◎ 同じ物件と判定":lk.level==="warn"?"△ 要確認":"× 地名が一致しません"}</b><br>仮予算「${esc(state.bud.meta.place)}」⇔ 実行予算「${esc(state.pdf.meta.place)}」<br><span style="color:var(--mute)">${esc(lk.how)} ${lk.notes.map(esc).join("／")}</span>`+
    (lk.level==="ok"?"":`<br><button class="btn" id="linkOk" style="margin-top:6px">同じ物件です（確認して記憶）</button>`);
  if($("linkOk"))$("linkOk").onclick=()=>{learn(lk.bt,lk.base);state.link={...lk,level:"ok",how:"確認済み（記憶しました）"};
    $("linkinfo").innerHTML=`<b style="color:var(--green)">◎ 確認済み</b>（次回から自動で一致扱い）`;render();};
}
async function loadFile(f,kind="R"){
  if(!f)return;const info=$(kind==="R"?"pdfinfo":"pdfinfoB");info.textContent="読み込み中…";
  try{
    const p=await parsePdf(await f.arrayBuffer());
    if(!p.items.length){info.textContent="建物原価の明細を読み取れませんでした。";return;}
    p.meta=parseTitle(p.title);state.tabName="";if(kind==="R")state.reg=null;
    if(kind==="R")state.pdf=p;else state.bud=p;
    info.innerHTML=`${esc(f.name)}（明細${p.items.length}行） <a href="#" data-clr="${kind}" style="font-size:12px">取消</a>`;
    info.querySelector("a").onclick=e=>{e.preventDefault();if(kind==="R"){state.pdf=null;state.map={};$("pdfinfo").textContent="";}else{state.bud=null;state.mapB={};$("pdfinfoB").textContent="";}updateLink();rematch();};
    if(kind==="R"||!state.pdf){
      const d=detect(p);const ai=$("autoinfo");
      if(!d.ok){ai.textContent="エリアを判定できませんでした。条件を選んでください。";}
      else{state.area=d.area;
        if(d.partial){ai.textContent=`自動判定: ${d.area}（${d.src}）。プラン・戸数は、PDFの金額が少ないため判定できません。選んでください。`;}
        else{state.plan=d.plan;state.units=d.units;state.band=d.band;
          ai.innerHTML=`自動判定: <b>${d.area}（${d.src}）／${d.plan}・${d.units}戸${d.plan==="1K"?"":"・㎡帯 "+d.band}</b><br><span style="color:var(--mute)">プラン・戸数・㎡帯はPDFの金額から推定しています。違う場合は上のボタンで直してください。</span>${d.warn?`<br><span style="color:var(--red)">${d.warn}</span>`:""}`;}
        seg("sArea",["関東","東海"],"area");seg("sPlan",["1LDK","1K"],"plan");seg("sUnits",[6,9,12],"units");seg("sBand",BANDS,"band");}
    }
    updateLink();rematch();
  }catch(e){info.textContent="読み込みエラー: "+e.message;}
}
const wireDrop=(dz,inp,kind)=>{dz.onclick=()=>inp.click();inp.onchange=e=>{loadFile(e.target.files[0],kind);inp.value="";};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add("over");};dz.ondragleave=()=>dz.classList.remove("over");
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");loadFile(e.dataTransfer.files[0],kind);};};
wireDrop($("drop"),$("file"),"R");wireDrop($("dropB"),$("fileB"),"B");
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=$("pw").value;if(!pw)return;$("lockErr").textContent="確認中…";
  try{
    const e=MASTER_ENC,base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    MASTER=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.data))));
    try{state.autoPush=localStorage.getItem("shime_autopush")==="1";}catch(e){}$("lock").remove();rematch();
  }catch(err){$("lockErr").textContent="パスワードが違います。";}
}
$("unlock").onclick=unlock;$("pw").onkeydown=e=>{if(e.key==="Enter")unlock();};$("pw").focus();
