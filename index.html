<title>締めナビ</title>

<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#6b7384;--line:#e1e4ea;--accent:#1f5eff;--red:#c0392b;--green:#1e8449}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d2129;--ink:#e8eaf0;--mute:#9aa3b5;--line:#2c323d;--accent:#6f9bff;--red:#ff7b6b;--green:#5fd18a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:baseline;gap:12px}
header h1{font-size:17px;margin:0}header span{color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:600}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;white-space:nowrap;padding:7px 0;border:0;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button:disabled{opacity:.4;cursor:default}
.seg button.on{background:var(--accent);color:#fff}
.drop{margin-top:6px;border:2px dashed var(--line);border-radius:8px;padding:18px 8px;text-align:center;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;color:var(--mute)}.kpi .d{font-size:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
td.t,th.t{text-align:left;white-space:normal}
tr.sub td{font-weight:700;background:var(--bg)}
.pos{color:var(--red);font-weight:600}.neg{color:var(--green);font-weight:600}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.tag.out{border-color:#e6a23c;color:#b9770e}
.scroll{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.warn{background:#fff4e5;color:#8a5a00;border:1px solid #f0c987;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
details summary{cursor:pointer;font-weight:600}
td input.cm{width:100%;padding:3px 6px;font-size:12px}
td select{padding:3px 4px;font-size:12px;max-width:260px}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}
.lock .card{width:340px;text-align:center}.lock h1{font-size:20px;margin:0 0 4px}.lock p{color:var(--mute);margin:0 0 14px;font-size:12px}
.lock .err{color:var(--red);min-height:20px;font-size:12px;margin-top:8px}.lock .btn{width:100%;margin-top:10px;background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

<header><h1><svg viewBox="0 0 120 120" width="30" height="30" style="vertical-align:middle"><defs><linearGradient id="g5h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#2B1B8F"/></linearGradient></defs>
<polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="url(#g5h)" stroke="url(#g5h)" stroke-width="8" stroke-linejoin="round"/>
<path d="M26 42 L48 60 L26 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M94 42 L72 60 L94 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="60" y1="34" x2="60" y2="86" stroke="#FFD166" stroke-width="9" stroke-linecap="round"/></svg> 締めナビ</h1><span>想定原価（一覧タブ）と結果（建物原価PDF）を項目ごとに比較</span></header>
<div class="lock" id="lock"><div class="card"><h1><svg viewBox="0 0 120 120" width="56" height="56" style="vertical-align:middle"><defs><linearGradient id="g5l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#2B1B8F"/></linearGradient></defs>
<polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="url(#g5l)" stroke="url(#g5l)" stroke-width="8" stroke-linejoin="round"/>
<path d="M26 42 L48 60 L26 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M94 42 L72 60 L94 78" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="60" y1="34" x2="60" y2="86" stroke="#FFD166" stroke-width="9" stroke-linecap="round"/></svg><br>締めナビ</h1><p>物件の原価締めを、想定とPDFの結果で比較します。<br>パスワードを入力してください。</p>
<input type="password" id="pw" placeholder="パスワード" autocomplete="current-password"><div class="err" id="lockErr"></div><button class="btn" id="unlock">開く</button></div></div>
<main>
 <aside class="card">
  <h2>① 物件条件（PDF取込で自動判定）</h2>
  <label>エリア</label><div class="seg" id="sArea"></div>
  <label>プラン</label><div class="seg" id="sPlan"></div>
  <label>戸数</label><div class="seg" id="sUnits"></div>
  <label>住戸㎡帯（1LDKのみ）</label><div class="seg" id="sBand"></div>
  <div class="hint" id="basis"></div>
  <h2 style="margin-top:18px">② 結果PDF（物件名も自動取得）</h2>
  <div class="drop" id="drop">ここにPDFをドロップ<br>またはクリックして選択</div>
  <input type="file" id="file" accept="application/pdf" hidden>
  <div class="hint" id="pdfinfo"></div>
  <div class="hint" id="autoinfo" style="color:var(--ink)"></div>
 </aside>
 <section id="out"><div class="card empty">物件条件を選んで、建物原価のPDFを取り込んでください。</div></section>
</main>

function norm(s){
  s=(s||"").normalize("NFKC").replace(/[（(][^）)]*[）)]/g,"").replace(/[（(].*$/,"").replace("取り出し","取出し");
  return s.replace(/[\s　・‧･、,，\-※①②③]/g,"");
}
const ALIAS=Object.fromEntries(Object.entries(ALIASES).map(([k,v])=>[norm(k),norm(v)]));
const isLandDefault=n=>LAND_WORDS.some(w=>n.includes(w));

  const m=(t||"").match(/^(\d+)\s*[.．]?\s*[●○◯◎]?\s*(.*)$/), rest=(m?m[2]:t||"").trim();
  const br=(rest.match(/^[A-Za-z]+/)||[""])[0], place=rest.slice(br.length).replace(/\s+/g," ").trim();
  return {no:m?+m[1]:"",brand:br,place,disp:[m?m[1]:"",br,place].filter(Boolean).join(" ")};
}

function cityArea(place){return TOKAI_RE.test(place)?"東海":KANTO_RE.test(place)?"関東":null;}
let MK=null;
function buildMK(){if(MK)return MK;MK={};for(const it of MASTER.items){const k=norm(it.name),o=MK[k]=MK[k]||{};for(const c in it.values)o[c]=(o[c]||0)+it.values[c];}return MK;}
function detect(P){
  const mk=buildMK(),keys=Object.keys(mk),res={},cols=Object.keys(MASTER.items[0].values);
  for(const it of P.items){if(!it.amount)continue;let k=norm(it.name);if(ALIAS[k])k=ALIAS[k];
    const h=mk[k]?k:(k.length>=4?keys.find(x=>x.length>=4&&(x.startsWith(k)||k.startsWith(x))):null);if(h)res[h]=(res[h]||0)+it.amount;}
  const n=Object.keys(res).length;
  const score=c=>{let s=0;for(const k in res){const m=mk[k][c],v=res[k];s-=Math.min(1,Math.abs(v-m)/Math.max(v,m,1));}return s;};
  const best=cs=>cs.reduce((a,c)=>score(c)>score(a)?c:a,cs[0]);
  const cityA=cityArea(P.meta.place);
  const amtA=n>=15?best(cols).split("|")[0]:null;
  const area=cityA||amtA, src=cityA?"地名":"金額";
  if(!area)return {ok:false,n};
  if(n<15)return {ok:true,area,src,partial:true,n};
  const [,plan,units,bd]=best(cols.filter(c=>c.startsWith(area+"|"))).split("|");
  return {ok:true,area,src,plan,units:+units,band:bd==="25"?state.band:bd,n,
    warn:(cityA&&amtA&&cityA!==amtA)?`地名は${cityA}ですが、金額は${amtA}の単価に近いです。`:""};
}

function masterRows(){
  const mk=`${state.area}|${state.plan}|${state.units}|${band()}`, rows=new Map();
  for(const it of MASTER.items){
    const k=norm(it.name), v=it.values[mk]||0;
    if(!rows.has(k))rows.set(k,{key:k,name:it.name,base:it.name.replace(/\s*[（(].*/,"").trim(),n:1,exp:v});
    else{const r=rows.get(k);r.n++;r.exp+=v;}
  }
  const out=[...rows.values()];out.forEach(r=>{if(r.n>1)r.name=`${r.base}（${r.n}項目合算）`});return out;
}

/* ---------- PDF解析 ---------- */
async function parsePdf(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc=await pdfjsLib.getDocument({data:buf}).promise, lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent(), its=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],w:i.width}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;
    for(const i of its){ if(cur&&Math.abs(cur.y-i.y)<=1)cur.it.push(i); else{cur={y:i.y,pg:p,it:[i]};lines.push(cur);} }
    lines.filter(l=>!l.sorted).forEach(l=>{l.it.sort((a,b)=>a.x-b.x);l.sorted=1;});
  }
  // 文字片が隣り合っていれば1つの「列」にまとめる
  for(const l of lines){const ch=[];for(const i of l.it){const c=ch[ch.length-1];if(c&&i.x-c.end<6){c.s+=i.s;c.end=i.x+i.w;}else ch.push({s:i.s,x:i.x,end:i.x+i.w});}l.ch=ch;}
  const txt=l=>l.ch.map(c=>c.s).join(" "), flat=l=>l.ch.map(c=>c.s).join("");
  const nums=s=>(s.match(/-?\d[\d,]*/g)||[]).map(x=>+x.replace(/,/g,""));
  const title=flat(lines[0]).replace(/印刷$/,"").trim();
  let summary={};
  const sl=lines.find(l=>/^税別/.test(flat(l)));
  if(sl){const n=nums(txt(sl));if(n.length>=7)summary=Object.fromEntries(["land_sale","bldg_sale","sale","land_cost","bldg_cost","cost","profit"].map((k,i)=>[k,n[i]]));}
  // 建物原価の表だけを対象にする（見出し「建物原価」〜「合計」）
  const sec=[];let inB=false;
  for(const l of lines){const f=flat(l);if(f==="建物原価"){inB=true;continue;}if(!inB)continue;if(/^合計/.test(f))break;sec.push(l);}
  const isData=l=>/^\d+$/.test(l.ch[0].s)&&l.ch.some(c=>c.s==="課税"||c.s==="非課税");
  const data=sec.filter(isData);
  // 「内容」列の左端x（支払先と内容の両方がある行の内容の位置の中央値）
  const xs=data.map(l=>{const ti=l.ch.findIndex(c=>c.s==="課税"||c.s==="非課税");const m=l.ch.slice(1,ti);return m.length>1?m[m.length-1].x:null;}).filter(x=>x!=null).sort((a,b)=>a-b);
  const cx=xs.length?xs[xs.length>>1]:144;
  // 折り返しで上下にはみ出した行は、いちばん近い明細行に付ける（±4以内）
  const wrap=new Map(data.map(l=>[l,[]]));
  for(const l of sec){if(isData(l))continue;
    let best=null;for(const d of data)if(d.pg===l.pg&&Math.abs(d.y-l.y)<=4&&(!best||Math.abs(d.y-l.y)<Math.abs(best.y-l.y)))best=d;
    if(best)wrap.get(best).push(l);}
  const items=[];
  for(const l of data){
    const ti=l.ch.findIndex(c=>c.s==="課税"||c.s==="非課税"), taxX=l.ch[ti].x;
    const inName=c=>c.x>=cx-3&&c.x<taxX-2;
    const parts=[l,...wrap.get(l)].sort((a,b)=>b.y-a.y);
    const name=parts.map(p=>p===l?l.ch.slice(1,ti).filter(inName):p.ch.filter(inName)).flat().map(c=>c.s).join("");
    const vendor=l.ch.slice(1,ti).filter(c=>c.x<cx-3).map(c=>c.s).join(" ");
    const am=l.ch[ti+1]&&nums(l.ch[ti+1].s)[0];
    items.push({no:+l.ch[0].s,vendor,name,amount:am||0});
  }
  const sum=items.reduce((a,b)=>a+b.amount,0);
  return {title,summary,items,sumOk:!!summary.bldg_cost&&sum===summary.bldg_cost,sum};
}

/* ---------- 照合・比較 ---------- */
function autoMatch(items,mrows){
  const keys=mrows.map(r=>r.key),m={};
  for(const it of items){
    let k=norm(it.name);if(ALIAS[k])k=ALIAS[k];
    let hit=keys.includes(k)?k:null;
    if(!hit&&k.length>=4)hit=keys.find(x=>x.length>=4&&(x.startsWith(k)||k.startsWith(x)))||null;
    m[it.no]=hit?hit:(isLandDefault(it.name)?"__L":"__B");
  }
  return m;
}
function compare(mrows,items,map){
  const got=new Map(mrows.map(r=>[r.key,[]])),extras=[];
  for(const it of items){const t=map[it.no];if(got.has(t))got.get(t).push(it);else extras.push({...it,kind:t==="__L"?"土地":"建物"});}
  const rows=mrows.map((r,i)=>{const g=got.get(r.key),res=g.reduce((a,b)=>a+b.amount,0);
    return {cls:LAND_KEYS.has(r.key)?"土地へ振替":"建物",no:i+1,name:r.name,exp:r.exp,res,diff:res-r.exp,src:g.map(x=>"#"+x.no).join(" ")};});
  for(const e of extras)rows.push({cls:`マスタ外(${e.kind})`,no:"+",name:e.name,exp:0,res:e.amount,diff:e.amount,src:`#${e.no} ${e.vendor}`});
  return rows;
}
const sumBy=(rows,f,c)=>rows.filter(r=>f(r.cls)).reduce((a,b)=>a+b[c],0);

async function exportXlsx(){
  const L=state.last;if(!L)return;
  const wb=new ExcelJS.Workbook();wb.creator="";wb.lastModifiedBy="";const ws=wb.addWorksheet("原価比較",{
    pageSetup:{paperSize:9,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,
      margins:{left:.4,right:.4,top:.6,bottom:.6,header:.3,footer:.3}}});
  const NAVY="FF1F3864",LIGHT="FFEAF0FB",GREY="FFF3F4F6",thin={style:"thin",color:{argb:"FFBFC5D2"}};
  const box=c=>{c.border={top:thin,left:thin,bottom:thin,right:thin};};
  const NUM='#,##0;-#,##0', DIFF='+#,##0;-#,##0;0';
  [5,40,15,15,15,15,36,32,16].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const name=dispName()||L.P.title, no=L.P.meta.no;
  ws.mergeCells("A1:I1");ws.getCell("A1").value="物件原価 比較表（想定 vs 結果）";ws.getCell("A1").font={bold:true,size:16,color:{argb:NAVY}};
  ws.getRow(1).height=34;

  const info=(r,t)=>{ws.mergeCells(r,1,r,3);const x=ws.getCell(r,1);x.value=t;x.alignment={horizontal:"left"};};
  info(2,"物件名　"+name);info(3,"条件　"+`${state.area} / ${state.plan} / ${state.units}戸 / ${bandLabel()}`);
  const kv=(r,k,v)=>{const a=ws.getCell(r,4),b=ws.getCell(r,5);a.value=k;a.font={bold:true,color:{argb:"FF6B7384"}};a.alignment={horizontal:"right"};b.value=v;b.alignment={horizontal:"left"};};
  kv(2,"FiX NO",no?+no:"");kv(3,"出力日",new Date().toLocaleDateString("ja-JP"));

  const D0=17, n=L.rows.length, D1=D0+n-1;   // 明細の範囲
  const rng=c=>`${c}$${D0}:${c}$${D1}`, sif=(c,k)=>`SUMIFS(${rng(c)},${rng("C")},"${k}")`;
  // サマリー
  const hdr=(r,labels)=>labels.forEach(([c,t])=>{const x=ws.getCell(r,c);x.value=t;x.font={bold:true,color:{argb:"FFFFFFFF"}};x.fill={type:"pattern",pattern:"solid",fgColor:{argb:NAVY}};x.alignment={horizontal:c>=7?"center":c>=4?"right":"left",vertical:"middle"};box(x);});
  hdr(5,[[2,"サマリー（税抜）"],[3,""],[4,"想定(マスタ)"],[5,"結果(PDF)"],[6,"差額"]]);
  const S=[
   ["建物原価のみ",{f:`${sif("D","建物")}+${sif("D","マスタ外(建物)")}`,r:L.eB},{f:`${sif("E","建物")}+${sif("E","マスタ外(建物)")}`,r:L.rB}],
   ["土地原価へ振替（地盤・造成・水道・公道）",{f:sif("D","土地へ振替"),r:L.eM},{f:sif("E","土地へ振替"),r:L.rM}],
   ["マスタ外項目（土地計上）",{f:sif("D","マスタ外(土地)"),r:0},{f:sif("E","マスタ外(土地)"),r:L.rX}],
   ["PDF上の土地原価",null,L.P.summary.land_cost||0],
   ["土地原価 合計",null,{f:"E7+E8+E9",r:L.landTotal}],
   ["原価合計（土地＋建物）",null,{f:"E6+E10",r:L.costTotal}],
   ["販売価格合計（税別）",null,L.sale],
   ["粗利",null,{f:"E12-E11",r:L.profit}],
   ["粗利率",null,{f:"IF(E12=0,0,E13/E12)",r:L.sale?L.profit/L.sale:0}]];
  S.forEach((row,i)=>{const r=6+i;
    const lab=ws.getCell(r,2);lab.value=row[0];ws.mergeCells(r,2,r,3);
    const put=(c,v,fmt)=>{const x=ws.getCell(r,c);if(v!==null&&v!==undefined)x.value=typeof v==="object"?{formula:v.f,result:v.r}:v;x.numFmt=fmt;box(x);};
    const pct=i===8;
    put(4,row[1],NUM);put(5,row[2],pct?"0.0%":NUM);
    if(i<3){const f=ws.getCell(r,6);f.value={formula:`E${r}-D${r}`,result:(row[2].r??row[2])-(row[1].r??0)};f.numFmt=DIFF;box(f);}else box(ws.getCell(r,6));
    box(lab);box(ws.getCell(r,3));
    if([4,5,7,8].includes(i)){for(let c=2;c<=6;c++){const x=ws.getCell(r,c);x.font={bold:true};x.fill={type:"pattern",pattern:"solid",fgColor:{argb:LIGHT}};}}
  });
  // 明細
  hdr(16,[[1,"No"],[2,"項目"],[3,"区分"],[4,"想定(マスタ)"],[5,"結果(PDF)"],[6,"差額"],[7,"増減の分析"],[8,"今後の対策"],[9,"PDF明細"]]);
  ws.getRow(16).height=22;
  L.rows.forEach((r,i)=>{const R=D0+i,cm=state.comments[ck(r)]||{};
    const vals=[r.no,r.name,r.cls,r.exp,r.res,{formula:`E${R}-D${R}`,result:r.diff},cm.a||"",cm.b||"",r.src];
    vals.forEach((v,j)=>{const x=ws.getCell(R,j+1);x.value=v;box(x);x.alignment={vertical:"top",wrapText:j>=6||j===1,horizontal:j>=3&&j<=5?"right":(j===0?"center":"left")};
      if(j===3||j===4)x.numFmt=NUM;if(j===5)x.numFmt=DIFF;if(j===8)x.font={size:9,color:{argb:"FF6B7384"}};});
    if(r.cls.startsWith("マスタ外")){ws.getCell(R,3).font={color:{argb:"FFB9770E"},bold:true};}
    if(r.cls==="土地へ振替"){ws.getCell(R,3).font={color:{argb:"FF1F5EFF"}};}
  });
  const T=D1+1;ws.getCell(T,2).value="合計";
  [4,5,6].forEach(c=>{const col="ABCDEFGHI"[c-1];const x=ws.getCell(T,c);x.value={formula:`SUM(${col}${D0}:${col}${D1})`,result:L.rows.reduce((a,r)=>a+(c===4?r.exp:c===5?r.res:r.diff),0)};x.numFmt=c===6?DIFF:NUM;});
  for(let c=1;c<=9;c++){const x=ws.getCell(T,c);x.font={bold:true};x.fill={type:"pattern",pattern:"solid",fgColor:{argb:GREY}};box(x);}
  const cf=ref=>ws.addConditionalFormatting({ref,rules:[
    {type:"cellIs",operator:"greaterThan",formulae:[0],style:{font:{color:{argb:"FFC0392B"},bold:true}}},
    {type:"cellIs",operator:"lessThan",formulae:[0],style:{font:{color:{argb:"FF1E8449"},bold:true}}}]});
  cf("F6:F8");cf(`F${D0}:F${T}`);
  // 印刷設定
  ws.pageSetup.printArea=`A1:I${T}`;ws.pageSetup.printTitlesRow="16:16";
  ws.headerFooter.oddHeader="&R"+name.replace(/&/g,"&&");
  ws.headerFooter.oddFooter="&L出力日 &D&C&P / &N ページ";
  ws.views=[{showGridLines:false}];
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=`${name}_原価比較表.xlsx`;a.click();
}

/* ---------- 書類回覧書（Excel） ---------- */
async function exportKairan(){
  const P=state.pdf;if(!P)return;const m=P.meta;
  const wb=new ExcelJS.Workbook();
  await wb.xlsx.load(Uint8Array.from(atob(MASTER.kairan),c=>c.charCodeAt(0)).buffer);
  const ws=wb.worksheets[0], serial=Math.floor((Date.now()+9*3600e3)/86400e3)+25569;
  ws.getCell("AF2").value={formula:"TODAY()",result:serial};          // 日付 = TODAY
  ws.getCell("F7").value="実行予算回覧の件";                           // 詳細
  ws.getCell("F9").value=m.no===""?null:+m.no;                          // 概要: FIX NO・ブランド・物件名（入力元）
  ws.getCell("H9").value=m.brand;ws.getCell("J9").value=m.place;
  ws.getCell("N7").value={formula:"F9",result:m.no===""?0:+m.no};      // 詳細欄は概要欄を参照
  ws.getCell("P7").value={formula:"H9",result:m.brand};
  ws.getCell("R7").value={formula:"J9",result:m.place};
  wb.creator="";wb.lastModifiedBy="";
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=`${m.disp||"物件"}_書類回覧書.xlsx`;a.click();
}

/* ---------- 入力 ---------- */
function seg(id,vals,key){
  const el=$(id);el.innerHTML=vals.map(v=>`<button data-v="${v}" class="${state[key]==v?"on":""}">${v}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state[key]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;seg(id,vals,key);rematch();});
}
function rematch(){
  document.querySelectorAll("#sBand button").forEach(b=>b.disabled=state.plan==="1K");
  $("basis").textContent=`想定の基準: ${state.area} / ${state.plan} / ${state.units}戸 / ${bandLabel()}`;
  if(state.pdf)state.map=autoMatch(state.pdf.items,masterRows());
  render();
}
seg("sArea",["関東","東海"],"area");seg("sPlan",["1LDK","1K"],"plan");seg("sUnits",[6,9,12],"units");
seg("sBand",BANDS,"band");
async function loadFile(f){
  if(!f)return;$("pdfinfo").textContent="読み込み中…";
  try{
    const p=await parsePdf(await f.arrayBuffer());
    if(!p.items.length){$("pdfinfo").textContent="建物原価の明細を読み取れませんでした。";return;}
    p.meta=parseTitle(p.title);state.pdf=p;$("pdfinfo").textContent=`${f.name}（明細${p.items.length}行）`;
    const d=detect(p);const ai=$("autoinfo");
    if(!d.ok){ai.textContent="エリアを判定できませんでした。条件を選んでください。";}
    else{state.area=d.area;
      if(d.partial){ai.textContent=`自動判定: ${d.area}（${d.src}）。プラン・戸数は、PDFの金額が少ないため判定できません。選んでください。`;}
      else{state.plan=d.plan;state.units=d.units;state.band=d.band;
        ai.innerHTML=`自動判定: <b>${d.area}（${d.src}）／${d.plan}・${d.units}戸${d.plan==="1K"?"":"・㎡帯 "+d.band}</b><br><span style="color:var(--mute)">プラン・戸数・㎡帯はPDFの金額から推定しています。違う場合は上のボタンで直してください。</span>${d.warn?`<br><span style="color:var(--red)">${d.warn}</span>`:""}`;}
      seg("sArea",["関東","東海"],"area");seg("sPlan",["1LDK","1K"],"plan");seg("sUnits",[6,9,12],"units");seg("sBand",BANDS,"band");}
    rematch();

  }catch(e){$("pdfinfo").textContent="読み込みエラー: "+e.message;}
}
const drop=$("drop");
drop.onclick=()=>$("file").click();$("file").onchange=e=>loadFile(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");loadFile(e.dataTransfer.files[0]);};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=$("pw").value;if(!pw)return;$("lockErr").textContent="確認中…";
  try{
    const e=MASTER_ENC,base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    MASTER=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.data))));
    $("lock").remove();rematch();
  }catch(err){$("lockErr").textContent="パスワードが違います。";}
}
$("unlock").onclick=unlock;$("pw").onkeydown=e=>{if(e.key==="Enter")unlock();};$("pw").focus();
</script>
