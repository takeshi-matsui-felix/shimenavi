<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>締めナビ</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mute:#6b7384;--line:#e1e4ea;--accent:#1f5eff;--red:#c0392b;--green:#1e8449}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d2129;--ink:#e8eaf0;--mute:#9aa3b5;--line:#2c323d;--accent:#6f9bff;--red:#ff7b6b;--green:#5fd18a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:baseline;gap:12px}
header h1{font-size:17px;margin:0}header span{color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:600}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;white-space:nowrap;padding:7px 0;border:0;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent);color:#fff}
.drop{margin-top:6px;border:2px dashed var(--line);border-radius:8px;padding:18px 8px;text-align:center;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;color:var(--mute)}.kpi .d{font-size:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
td.t,th.t{text-align:left;white-space:normal}
tr.sub td{font-weight:700;background:var(--bg)}
.pos{color:var(--red);font-weight:600}.neg{color:var(--green);font-weight:600}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.tag.out{border-color:#e6a23c;color:#b9770e}
.scroll{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.warn{background:#fff4e5;color:#8a5a00;border:1px solid #f0c987;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
details summary{cursor:pointer;font-weight:600}
td select{padding:3px 4px;font-size:12px;max-width:260px}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}
.lock .card{width:340px;text-align:center}.lock h1{font-size:20px;margin:0 0 4px}.lock p{color:var(--mute);margin:0 0 14px;font-size:12px}
.lock .err{color:var(--red);min-height:20px;font-size:12px;margin-top:8px}.lock .btn{width:100%;margin-top:10px;background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header><h1>🏗️ 締めナビ</h1><span>想定原価（一覧タブ）と結果（建物原価PDF）を項目ごとに比較</span></header>
<div class="lock" id="lock"><div class="card"><h1>🏗️ 締めナビ</h1><p>物件の原価締めを、想定とPDFの結果で比較します。<br>パスワードを入力してください。</p>
<input type="password" id="pw" placeholder="パスワード" autocomplete="current-password"><div class="err" id="lockErr"></div><button class="btn" id="unlock">開く</button></div></div>
<main>
 <aside class="card">
  <h2>① 物件条件</h2>
  <label>物件名</label><input type="text" id="name" placeholder="例: Jackさいたま市北区宮原町Ⅱ">
  <label>エリア</label><div class="seg" id="sArea"></div>
  <label>プラン</label><div class="seg" id="sPlan"></div>
  <label>戸数</label><div class="seg" id="sUnits"></div>
  <label>住戸㎡数（1LDKのみ使用）</label><input type="number" id="sqm" value="30" min="15" max="60" step="0.5">
  <div class="hint" id="basis"></div>
  <h2 style="margin-top:18px">② 結果PDF</h2>
  <div class="drop" id="drop">ここにPDFをドロップ<br>またはクリックして選択</div>
  <input type="file" id="file" accept="application/pdf" hidden>
  <div class="hint" id="pdfinfo"></div>
 </aside>
 <section id="out"><div class="card empty">物件条件を選んで、建物原価のPDFを取り込んでください。</div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

function norm(s){
  s=(s||"").normalize("NFKC").replace(/[（(][^）)]*[）)]/g,"").replace(/[（(].*$/,"").replace("取り出し","取出し");
  return s.replace(/[\s　・‧･、,，\-※①②③]/g,"");
}
const ALIAS=Object.fromEntries(Object.entries(ALIASES).map(([k,v])=>[norm(k),norm(v)]));
const isLandDefault=n=>LAND_WORDS.some(w=>n.includes(w));

function band(){const q=+$("sqm").value;if(state.plan==="1K")return "25";return q<=32?BANDS[0]:q<=37?BANDS[1]:q<=42?BANDS[2]:BANDS[3];}
function masterRows(){
  const mk=`${state.area}|${state.plan}|${state.units}|${band()}`, rows=new Map();
  for(const it of MASTER.items){
    const k=norm(it.name), v=it.values[mk]||0;
    if(!rows.has(k))rows.set(k,{key:k,name:it.name,base:it.name.replace(/\s*[（(].*/,"").trim(),n:1,exp:v});
    else{const r=rows.get(k);r.n++;r.exp+=v;}
  }
  const out=[...rows.values()];out.forEach(r=>{if(r.n>1)r.name=`${r.base}（${r.n}項目合算）`});return out;
}

/* ---------- PDF解析 ---------- */
async function parsePdf(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc=await pdfjsLib.getDocument({data:buf}).promise, lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent(), its=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],w:i.width}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;
    for(const i of its){ if(cur&&Math.abs(cur.y-i.y)<=1)cur.it.push(i); else{cur={y:i.y,pg:p,it:[i]};lines.push(cur);} }
    lines.filter(l=>!l.sorted).forEach(l=>{l.it.sort((a,b)=>a.x-b.x);l.sorted=1;});
  }
  // 文字片が隣り合っていれば1つの「列」にまとめる
  for(const l of lines){const ch=[];for(const i of l.it){const c=ch[ch.length-1];if(c&&i.x-c.end<6){c.s+=i.s;c.end=i.x+i.w;}else ch.push({s:i.s,x:i.x,end:i.x+i.w});}l.ch=ch;}
  const txt=l=>l.ch.map(c=>c.s).join(" "), flat=l=>l.ch.map(c=>c.s).join("");
  const nums=s=>(s.match(/-?\d[\d,]*/g)||[]).map(x=>+x.replace(/,/g,""));
  const title=flat(lines[0]).replace(/印刷$/,"").trim();
  let summary={};
  const sl=lines.find(l=>/^税別/.test(flat(l)));
  if(sl){const n=nums(txt(sl));if(n.length>=7)summary=Object.fromEntries(["land_sale","bldg_sale","sale","land_cost","bldg_cost","cost","profit"].map((k,i)=>[k,n[i]]));}
  // 建物原価の表だけを対象にする（見出し「建物原価」〜「合計」）
  const sec=[];let inB=false;
  for(const l of lines){const f=flat(l);if(f==="建物原価"){inB=true;continue;}if(!inB)continue;if(/^合計/.test(f))break;sec.push(l);}
  const isData=l=>/^\d+$/.test(l.ch[0].s)&&l.ch.some(c=>c.s==="課税"||c.s==="非課税");
  const data=sec.filter(isData);
  // 「内容」列の左端x（支払先と内容の両方がある行の内容の位置の中央値）
  const xs=data.map(l=>{const ti=l.ch.findIndex(c=>c.s==="課税"||c.s==="非課税");const m=l.ch.slice(1,ti);return m.length>1?m[m.length-1].x:null;}).filter(x=>x!=null).sort((a,b)=>a-b);
  const cx=xs.length?xs[xs.length>>1]:144;
  // 折り返しで上下にはみ出した行は、いちばん近い明細行に付ける（±4以内）
  const wrap=new Map(data.map(l=>[l,[]]));
  for(const l of sec){if(isData(l))continue;
    let best=null;for(const d of data)if(d.pg===l.pg&&Math.abs(d.y-l.y)<=4&&(!best||Math.abs(d.y-l.y)<Math.abs(best.y-l.y)))best=d;
    if(best)wrap.get(best).push(l);}
  const items=[];
  for(const l of data){
    const ti=l.ch.findIndex(c=>c.s==="課税"||c.s==="非課税"), taxX=l.ch[ti].x;
    const inName=c=>c.x>=cx-3&&c.x<taxX-2;
    const parts=[l,...wrap.get(l)].sort((a,b)=>b.y-a.y);
    const name=parts.map(p=>p===l?l.ch.slice(1,ti).filter(inName):p.ch.filter(inName)).flat().map(c=>c.s).join("");
    const vendor=l.ch.slice(1,ti).filter(c=>c.x<cx-3).map(c=>c.s).join(" ");
    const am=l.ch[ti+1]&&nums(l.ch[ti+1].s)[0];
    items.push({no:+l.ch[0].s,vendor,name,amount:am||0});
  }
  const sum=items.reduce((a,b)=>a+b.amount,0);
  return {title,summary,items,sumOk:!!summary.bldg_cost&&sum===summary.bldg_cost,sum};
}

/* ---------- 照合・比較 ---------- */
function autoMatch(items,mrows){
  const keys=mrows.map(r=>r.key),m={};
  for(const it of items){
    let k=norm(it.name);if(ALIAS[k])k=ALIAS[k];
    let hit=keys.includes(k)?k:null;
    if(!hit&&k.length>=4)hit=keys.find(x=>x.length>=4&&(x.startsWith(k)||k.startsWith(x)))||null;
    m[it.no]=hit?hit:(isLandDefault(it.name)?"__L":"__B");
  }
  return m;
}
function compare(mrows,items,map){
  const got=new Map(mrows.map(r=>[r.key,[]])),extras=[];
  for(const it of items){const t=map[it.no];if(got.has(t))got.get(t).push(it);else extras.push({...it,kind:t==="__L"?"土地":"建物"});}
  const rows=mrows.map((r,i)=>{const g=got.get(r.key),res=g.reduce((a,b)=>a+b.amount,0);
    return {cls:LAND_KEYS.has(r.key)?"土地へ振替":"建物",no:i+1,name:r.name,exp:r.exp,res,diff:res-r.exp,src:g.map(x=>"#"+x.no).join(" ")};});
  for(const e of extras)rows.push({cls:`マスタ外(${e.kind})`,no:"+",name:e.name,exp:0,res:e.amount,diff:e.amount,src:`#${e.no} ${e.vendor}`});
  return rows;
}
const sumBy=(rows,f,c)=>rows.filter(r=>f(r.cls)).reduce((a,b)=>a+b[c],0);

/* ---------- 描画 ---------- */
function render(){
  const out=$("out");
  if(!state.pdf){out.innerHTML='<div class="card empty">物件条件を選んで、建物原価のPDFを取り込んでください。</div>';return;}
  const P=state.pdf, mrows=masterRows(), rows=compare(mrows,P.items,state.map), S=P.summary;
  const eB=sumBy(rows,k=>k==="建物"||k==="マスタ外(建物)","exp"), rB=sumBy(rows,k=>k==="建物"||k==="マスタ外(建物)","res");
  const eM=sumBy(rows,k=>k==="土地へ振替","exp"), rM=sumBy(rows,k=>k==="土地へ振替","res");
  const rX=sumBy(rows,k=>k==="マスタ外(土地)","res");
  const landTotal=(S.land_cost||0)+rM+rX, costTotal=rB+landTotal, sale=S.sale||0, profit=sale-costTotal;
  const dc=v=>v===0?"":`<span class="${v>0?"pos":"neg"}">${v>0?"+":""}${yen(v)}</span>`;
  const view=state.view, shown=rows.filter(r=>view==="all"||(view==="diff"&&r.diff!==0)||(view==="over"&&r.diff>0)||(view==="out"&&r.cls.startsWith("マスタ外")));
  const nOut=P.items.filter(i=>state.map[i.no]==="__B"||state.map[i.no]==="__L").length;
  const opts=t=>mrows.map(r=>`<option value="${r.key}" ${t===r.key?"selected":""}>${r.name}</option>`).join("")+
     `<option value="__B" ${t==="__B"?"selected":""}>${OUT_B}</option><option value="__L" ${t==="__L"?"selected":""}>${OUT_L}</option>`;
  out.innerHTML=`
  ${P.sumOk?"":`<div class="warn">明細の合計(${yen(P.sum)})がPDFの建物原価合計(${yen(S.bldg_cost||0)})と一致しません。取込結果をご確認ください。</div>`}
  ${costTotal!==S.cost?`<div class="warn">原価合計(${yen(costTotal)})がPDFの原価合計(${yen(S.cost||0)})と一致しません。</div>`:""}
  <div class="card" style="margin-bottom:12px"><div style="font-size:16px;font-weight:700;margin-bottom:10px">${esc($("name").value||P.title)}</div>
   <div class="kpis">
    <div class="kpi"><div class="l">建物原価のみ（結果）</div><div class="n">${yen(rB)}</div><div class="d">想定比 ${dc(rB-eB)||"±0"}</div></div>
    <div class="kpi"><div class="l">土地原価 合計（結果）</div><div class="n">${yen(landTotal)}</div></div>
    <div class="kpi"><div class="l">原価合計</div><div class="n">${yen(costTotal)}</div></div>
    <div class="kpi"><div class="l">粗利（税別）</div><div class="n">${yen(profit)}</div><div class="d">${sale?(profit/sale*100).toFixed(1)+"%":""}</div></div>
   </div></div>
  <div class="card" style="margin-bottom:12px"><h2>サマリー</h2><table>
   <tr><th class="t"></th><th>想定(マスタ)</th><th>結果(PDF)</th><th>差額</th></tr>
   <tr><td class="t">建物原価のみ</td><td>${yen(eB)}</td><td>${yen(rB)}</td><td>${dc(rB-eB)}</td></tr>
   <tr><td class="t">土地原価へ振替（地盤・造成・水道・公道）</td><td>${yen(eM)}</td><td>${yen(rM)}</td><td>${dc(rM-eM)}</td></tr>
   <tr><td class="t">マスタ外項目（土地計上）</td><td>0</td><td>${yen(rX)}</td><td>${dc(rX)}</td></tr>
   <tr><td class="t">PDF上の土地原価</td><td></td><td>${yen(S.land_cost||0)}</td><td></td></tr>
   <tr class="sub"><td class="t">土地原価 合計</td><td></td><td>${yen(landTotal)}</td><td></td></tr>
   <tr class="sub"><td class="t">原価合計（土地＋建物）</td><td></td><td>${yen(costTotal)}</td><td></td></tr>
   <tr><td class="t">販売価格合計（税別）</td><td></td><td>${yen(sale)}</td><td></td></tr>
   <tr class="sub"><td class="t">粗利</td><td></td><td>${yen(profit)}</td><td></td></tr></table></div>
  <details class="card" style="margin-bottom:12px"><summary>項目の対応づけ（自動判定・マスタ外 ${nOut}行）— 違っていたらここで直せます</summary>
   <div class="scroll" style="margin-top:10px;max-height:360px"><table><tr><th>No</th><th class="t">PDFの内容</th><th>金額(税抜)</th><th class="t">対応先</th></tr>
   ${P.items.map(i=>`<tr><td>${i.no}</td><td class="t">${esc(i.name)}</td><td>${yen(i.amount)}</td><td class="t"><select data-no="${i.no}">${opts(state.map[i.no])}</select></td></tr>`).join("")}</table></div></details>
  <div class="card"><h2>項目別 比較表（想定 vs 結果）</h2>
   <div class="row"><div class="seg" id="sView" style="width:auto">${[["all","すべて"],["diff","差額あり"],["over","超過のみ"],["out","マスタ外のみ"]].map(([k,l])=>`<button data-v="${k}" class="${view===k?"on":""}" style="padding:6px 14px">${l}</button>`).join("")}</div>
    <button class="btn" id="csv">CSVで保存</button><span class="hint">差額＝結果−想定　赤＝超過／緑＝想定以下</span></div>
   <div class="scroll"><table><tr><th>No</th><th class="t">項目</th><th class="t">区分</th><th>想定(マスタ)</th><th>結果(PDF)</th><th>差額</th><th class="t">PDF明細</th></tr>
   ${shown.map(r=>`<tr><td>${r.no}</td><td class="t">${esc(r.name)}</td><td class="t"><span class="tag ${r.cls.startsWith("マスタ外")?"out":""}">${r.cls}</span></td><td>${yen(r.exp)}</td><td>${yen(r.res)}</td><td>${dc(r.diff)}</td><td class="t" style="color:var(--mute)">${esc(r.src)}</td></tr>`).join("")}</table></div>
   <div class="hint">ガードマン手配・工事用駐車場はマスタが複数行のため合算で比較しています。</div></div>`;
  out.querySelectorAll("select[data-no]").forEach(s=>s.onchange=()=>{state.map[s.dataset.no]=s.value;render();});
  out.querySelectorAll("#sView button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render();});
  $("csv").onclick=()=>{
    const h=["区分","No","項目","想定(マスタ)","結果(PDF)","差額","PDF明細"],q=v=>`"${String(v).replace(/"/g,'""')}"`;
    const csv="﻿"+[h.map(q).join(","),...rows.map(r=>[r.cls,r.no,r.name,r.exp,r.res,r.diff,r.src].map(q).join(","))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${$("name").value||P.title}_原価比較.csv`;a.click();};
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 入力 ---------- */
function seg(id,vals,key){
  const el=$(id);el.innerHTML=vals.map(v=>`<button data-v="${v}" class="${state[key]==v?"on":""}">${v}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state[key]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;seg(id,vals,key);rematch();});
}
function rematch(){
  $("sqm").disabled=state.plan==="1K";
  $("basis").textContent=`想定の基準: ${state.area} / ${state.plan} / ${state.units}戸 / ㎡帯 ${band()}`;
  if(state.pdf)state.map=autoMatch(state.pdf.items,masterRows());
  render();
}
seg("sArea",["関東","東海"],"area");seg("sPlan",["1LDK","1K"],"plan");seg("sUnits",[6,9,12],"units");
$("sqm").oninput=rematch;$("name").oninput=()=>state.pdf&&render();
async function loadFile(f){
  if(!f)return;$("pdfinfo").textContent="読み込み中…";
  try{
    const p=await parsePdf(await f.arrayBuffer());
    if(!p.items.length){$("pdfinfo").textContent="建物原価の明細を読み取れませんでした。";return;}
    state.pdf=p;$("pdfinfo").textContent=`${f.name}（明細${p.items.length}行）`;
    if(!$("name").value)$("name").value=p.title.replace(/^\d+\.\s*[●○]?/,"");
    rematch();
  }catch(e){$("pdfinfo").textContent="読み込みエラー: "+e.message;}
}
const drop=$("drop");
drop.onclick=()=>$("file").click();$("file").onchange=e=>loadFile(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");loadFile(e.dataTransfer.files[0]);};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=$("pw").value;if(!pw)return;$("lockErr").textContent="確認中…";
  try{
    const e=MASTER_ENC,base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    MASTER=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.data))));
    $("lock").remove();rematch();
  }catch(err){$("lockErr").textContent="パスワードが違います。";}
}
$("unlock").onclick=unlock;$("pw").onkeydown=e=>{if(e.key==="Enter")unlock();};$("pw").focus();
</script>
